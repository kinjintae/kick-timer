<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>품새 연습기 (시제품)</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Pretendard','Malgun Gothic',sans-serif; background:#111; color:#eee; }
  header { padding:10px 16px; background:#1c1c1c; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 12px 0 0; color:#ffd400; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid #444; background:#2a2a2a; color:#eee; cursor:pointer; }
  button.on { background:#ffd400; color:#111; border-color:#ffd400; font-weight:700; }
  button:disabled { opacity:.4; cursor:default; }
  main { display:flex; gap:12px; padding:12px; }
  #stage { position:relative; flex:1; background:#000; border-radius:12px; overflow:hidden; min-height:40vh; }
  #stage canvas { width:100%; height:auto; max-height:85vh; object-fit:contain; display:block; margin:0 auto; }
  #overlay { position:absolute; left:0; right:0; top:0; padding:16px; text-align:center; pointer-events:none; }
  #stepName { font-size:clamp(22px,4vw,48px); font-weight:800; text-shadow:0 2px 6px #000; }
  #feedback { font-size:clamp(16px,2.4vw,28px); margin-top:6px; text-shadow:0 2px 6px #000; }
  #countdown { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:160px; font-weight:900; color:#ffd400; text-shadow:0 4px 20px #000; pointer-events:none; }
  #barWrap { position:absolute; left:16px; right:16px; bottom:16px; height:22px; background:#333a; border-radius:11px; overflow:hidden; }
  #bar { height:100%; width:0; background:#e33; transition:width .1s; }
  aside { width:320px; display:flex; flex-direction:column; gap:10px; }
  .card { background:#1c1c1c; border-radius:12px; padding:12px; }
  .card h3 { margin:0 0 8px; font-size:15px; color:#ffd400; }
  ol { margin:0; padding-left:22px; max-height:38vh; overflow:auto; }
  li { padding:5px 4px; border-radius:6px; cursor:pointer; }
  li.cur { background:#ffd40033; }
  li.done { color:#6c6; }
  li .tag { font-size:12px; margin-left:6px; color:#888; }
  li .tag.ok { color:#6c6; }
  label { display:block; font-size:13px; margin:6px 0; }
  input[type=range] { width:100%; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  small { color:#999; }
  @media (max-width:900px){ main{flex-direction:column;} aside{width:auto;} }
</style>
</head>
<body>
<header>
  <h1>품새 연습기</h1>
  <button id="modePractice" class="on">연습 모드</button>
  <button id="modeRecord">정답 녹화 모드</button>
  <span style="flex:1"></span>
  <button id="startCam">카메라 켜기</button>
  <button id="flipCam">앞/뒤 카메라</button>
  <button id="fullBtn">전체화면</button>
</header>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay"><div id="stepName">카메라를 켜주세요</div><div id="feedback"></div></div>
    <div id="countdown"></div>
    <div id="barWrap"><div id="bar"></div></div>
  </div>
  <aside>
    <div class="card">
      <h3>동작 순서</h3>
      <ol id="steps"></ol>
      <div class="row" style="margin-top:8px">
        <button id="prevBtn">◀ 이전</button>
        <button id="nextBtn">다음 ▶</button>
        <button id="resetBtn">처음부터</button>
      </div>
    </div>
    <div class="card" id="recordCard" style="display:none">
      <h3>정답 녹화</h3>
      <small>순서에서 동작을 고르고 [자세 저장]을 누르세요. 3초 뒤 1초 동안 자세를 측정합니다. 관장님이 정확한 자세로 서 주세요.</small>
      <div class="row" style="margin-top:8px">
        <button id="captureBtn">자세 저장 (3초 후)</button>
        <button id="clearBtn">이 동작 지우기</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="addStepBtn">동작 추가</button>
        <button id="renameBtn">이름 바꾸기</button>
        <button id="delStepBtn">동작 삭제</button>
      </div>
    </div>
    <div class="card">
      <h3>판정 설정</h3>
      <label>허용 오차: <b id="tolV"></b>°  <small>(작을수록 엄격)</small>
        <input type="range" id="tol" min="8" max="40" value="20"></label>
      <label>유지 시간: <b id="holdV"></b>초
        <input type="range" id="hold" min="0.3" max="2" step="0.1" value="0.7"></label>
      <label><input type="checkbox" id="useYaw" checked> 몸 방향(돌기)도 판정 <small>— 정면 카메라라 부정확할 수 있음</small></label>
      <label><input type="checkbox" id="mirror" checked> 거울처럼 좌우 반전 표시</label>
    </div>
    <div class="card">
      <h3>데이터</h3>
      <div class="row">
        <button id="exportBtn">파일로 내보내기</button>
        <button id="importBtn">불러오기</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
      <small>정답 자세는 이 브라우저에 자동 저장됩니다. 다른 기기로 옮길 때는 파일로 내보내세요.</small>
    </div>
  </aside>
</main>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ---------- 관절 각도 정의 (MediaPipe 랜드마크 번호) ----------
// 11/12 어깨, 13/14 팔꿈치, 15/16 손목, 23/24 엉덩이, 25/26 무릎, 27/28 발목
const JOINTS = [
  { name:'왼팔꿈치',   pts:[11,13,15] },
  { name:'오른팔꿈치', pts:[12,14,16] },
  { name:'왼팔(몸통 기준)',   pts:[23,11,13] },
  { name:'오른팔(몸통 기준)', pts:[24,12,14] },
  { name:'왼팔(어깨선 기준)',   pts:[12,11,13] },
  { name:'오른팔(어깨선 기준)', pts:[11,12,14] },
  { name:'왼쪽 엉덩이', pts:[11,23,25] },
  { name:'오른쪽 엉덩이', pts:[12,24,26] },
  { name:'왼다리 벌림', pts:[24,23,25] },
  { name:'오른다리 벌림', pts:[23,24,26] },
  { name:'왼무릎', pts:[23,25,27] },
  { name:'오른무릎', pts:[24,26,28] },
];
const KEY_POINTS = [11,12,13,14,15,16,23,24,25,26,27,28];

const DEFAULT_STEPS = [
  '준비',
  '1. 왼 앞서기 아래막기',
  '2. 오른 앞서기 몸통반대지르기',
  '3. 오른 앞서기 아래막기',
  '4. 왼 앞서기 몸통반대지르기',
];

// ---------- 저장 ----------
const STORE_KEY = 'poomsae_proto_v1';
let data = { title:'태극 1장', steps: DEFAULT_STEPS.map(n => ({ name:n, ref:null })) };
try { const s = localStorage.getItem(STORE_KEY); if (s) data = JSON.parse(s); } catch(e) {}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e) {} }

// ---------- 상태 ----------
let mode = 'practice';
let cur = 0;
let passed = new Set();
let holdStart = null;
let landmarker = null, video = null, running = false, drawer = null;
let lastFeat = null;
let capturing = null;   // { until, samples:[] }
let lastTs = -1;
let facing = 'user';
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

// ---------- 수학 ----------
function angle3(a,b,c){
  const v1=[a.x-b.x,a.y-b.y,a.z-b.z], v2=[c.x-b.x,c.y-b.y,c.z-b.z];
  const d=v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2];
  const n=Math.hypot(...v1)*Math.hypot(...v2);
  if(!n) return 0;
  return Math.acos(Math.max(-1,Math.min(1,d/n)))*180/Math.PI;
}
function features(world){
  const angles = JOINTS.map(j => angle3(world[j.pts[0]], world[j.pts[1]], world[j.pts[2]]));
  const L=world[11], R=world[12];
  const yaw = Math.atan2(R.z-L.z, R.x-L.x)*180/Math.PI;  // 어깨선이 카메라 기준 얼마나 돌았나
  return { angles, yaw };
}
function yawDiff(a,b){ let d=Math.abs(a-b)%360; return d>180?360-d:d; }
function avgFeatures(list){
  const n=list.length;
  const angles = JOINTS.map((_,i)=> list.reduce((s,f)=>s+f.angles[i],0)/n);
  // 각도 평균은 단위벡터로
  let sx=0, sy=0; list.forEach(f=>{ sx+=Math.cos(f.yaw*Math.PI/180); sy+=Math.sin(f.yaw*Math.PI/180); });
  return { angles, yaw: Math.atan2(sy,sx)*180/Math.PI };
}
function compare(f, ref){
  const diffs = f.angles.map((a,i)=>Math.abs(a-ref.angles[i]));
  const mean = diffs.reduce((s,d)=>s+d,0)/diffs.length;
  let worst = 0; diffs.forEach((d,i)=>{ if(d>diffs[worst]) worst=i; });
  const yd = yawDiff(f.yaw, ref.yaw);
  return { mean, worst, worstDiff: diffs[worst], yd };
}

// ---------- 화면 ----------
function renderSteps(){
  const ol=$('steps'); ol.innerHTML='';
  data.steps.forEach((s,i)=>{
    const li=document.createElement('li');
    li.textContent=s.name;
    const t=document.createElement('span');
    t.className='tag'+(s.ref?' ok':'');
    t.textContent = s.ref ? '정답 있음' : '정답 없음';
    li.appendChild(t);
    if(i===cur) li.classList.add('cur');
    if(passed.has(i)) li.classList.add('done');
    li.onclick=()=>{ cur=i; holdStart=null; renderSteps(); updateTitle(); };
    ol.appendChild(li);
  });
  const c = ol.children[cur]; if(c) c.scrollIntoView({block:'nearest'});
}
function updateTitle(msg){
  const s=data.steps[cur];
  $('stepName').textContent = s ? s.name : '';
  if(msg!==undefined) $('feedback').textContent = msg;
}
function setBar(p, color){ $('bar').style.width=(Math.max(0,Math.min(1,p))*100)+'%'; $('bar').style.background=color; }

function setMode(m){
  mode=m;
  $('modePractice').classList.toggle('on', m==='practice');
  $('modeRecord').classList.toggle('on', m==='record');
  $('recordCard').style.display = m==='record' ? '' : 'none';
  holdStart=null; updateTitle(m==='record' ? '동작을 고르고 [자세 저장]을 누르세요' : '');
}

// ---------- 카메라 / 모델 ----------
async function start(){
  $('startCam').disabled=true;
  updateTitle('AI 모델 불러오는 중… (처음엔 10초 정도 걸립니다)');
  let stage='카메라';
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('이 화면에서는 카메라를 쓸 수 없습니다'),{name:'NoMediaDevices'});
    // 카메라 먼저 확인
    await openCamera();
    stage='AI 모델';
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = (delegate)=>({
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/"+(IS_MOBILE?"pose_landmarker_lite/float16/1/pose_landmarker_lite.task":"pose_landmarker_full/float16/1/pose_landmarker_full.task"), delegate },
      runningMode:'VIDEO', numPoses:1
    });
    try { landmarker = await PoseLandmarker.createFromOptions(vision, opts('GPU')); }
    catch(e){ landmarker = await PoseLandmarker.createFromOptions(vision, opts('CPU')); }

    cv.width=video.videoWidth; cv.height=video.videoHeight;
    drawer = new DrawingUtils(ctx);
    running=true;
    updateTitle(mode==='record' ? '동작을 고르고 [자세 저장]을 누르세요' : '');
    requestAnimationFrame(loop);
  }catch(e){
    console.error(e);
    const n=e && e.name;
    let why;
    if(n==='NoMediaDevices') why='앱 미리보기 화면에서는 카메라가 막힙니다. 파일을 내려받아 크롬으로 직접 여세요.';
    else if(n==='NotAllowedError'||n==='SecurityError') why='카메라 권한이 거부됐습니다. 주소창 왼쪽 자물쇠/아이콘 → 카메라 [허용] 후 새로고침.';
    else if(n==='NotFoundError'||n==='OverconstrainedError') why='연결된 웹캠을 찾지 못했습니다. 웹캠 연결을 확인하세요.';
    else if(n==='NotReadableError'||n==='AbortError') why='다른 프로그램(줌, 카톡, OBS 등)이 카메라를 쓰고 있습니다. 끄고 다시 시도하세요.';
    else if(stage==='AI 모델') why='AI 모델을 받지 못했습니다. 인터넷 연결을 확인하세요.';
    else why='알 수 없는 오류';
    updateTitle(stage+' 단계 실패');
    $('feedback').textContent = why+'  ['+(n||'')+': '+(e.message||e)+']';
    $('startCam').disabled=false;
  }
}

async function openCamera(){
  if(video && video.srcObject){ video.srcObject.getTracks().forEach(t=>t.stop()); }
  if(!video){ video=document.createElement('video'); video.playsInline=true; video.muted=true; video.setAttribute('playsinline',''); }
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720} }, audio:false });
  await video.play();
  cv.width=video.videoWidth; cv.height=video.videoHeight;
}

function loop(){
  if(!running) return;
  const now=performance.now();
  if(video.readyState>=2 && now!==lastTs){
    lastTs=now;
    const res = landmarker.detectForVideo(video, now);
    const mirror=$('mirror').checked;
    ctx.save();
    if(mirror){ ctx.translate(cv.width,0); ctx.scale(-1,1); }
    ctx.drawImage(video,0,0,cv.width,cv.height);
    if(res.landmarks && res.landmarks[0]){
      drawer.drawConnectors(res.landmarks[0], PoseLandmarker.POSE_CONNECTIONS, { color:'#ffd400', lineWidth:4 });
      drawer.drawLandmarks(res.landmarks[0], { color:'#fff', radius:3 });
    }
    ctx.restore();
    handle(res, now);
  }
  requestAnimationFrame(loop);
}

function handle(res, now){
  const lm = res.landmarks && res.landmarks[0];
  const world = res.worldLandmarks && res.worldLandmarks[0];
  if(!lm || !world){ lastFeat=null; holdStart=null; setBar(0,'#e33'); if(!capturing) updateTitle(undefined), $('feedback').textContent='사람이 안 보입니다'; return; }
  const visible = KEY_POINTS.every(i => (lm[i].visibility ?? 1) > 0.5);
  if(!visible){ holdStart=null; setBar(0,'#e33'); if(!capturing) $('feedback').textContent='머리부터 발끝까지 화면에 들어오게 뒤로 가 주세요'; return; }
  const f = features(world); lastFeat=f;

  // 녹화 중
  if(capturing){
    if(now>=capturing.startAt){
      capturing.samples.push(f);
      $('feedback').textContent='측정 중… 자세 유지!';
      if(now>=capturing.startAt+1000){
        const step=data.steps[cur];
        step.ref = avgFeatures(capturing.samples);
        capturing=null; save(); renderSteps();
        $('countdown').textContent='';
        $('feedback').textContent='✅ 저장 완료 ('+step.name+')';
      }
    }
    return;
  }
  if(mode!=='practice') return;

  const step=data.steps[cur];
  if(!step){ return; }
  if(!step.ref){ $('feedback').textContent='이 동작은 정답이 아직 없습니다 (정답 녹화 모드에서 저장)'; setBar(0,'#e33'); return; }

  const tol=+$('tol').value, holdSec=+$('hold').value, useYaw=$('useYaw').checked;
  const c = compare(f, step.ref);
  const okAngles = c.mean <= tol && c.worstDiff <= tol*2;
  const okYaw = !useYaw || c.yd <= 35;
  const closeness = Math.max(0, 1 - c.mean/(tol*2.5));

  if(okAngles && okYaw){
    if(holdStart===null) holdStart=now;
    const p=(now-holdStart)/(holdSec*1000);
    setBar(p,'#4c4');
    $('feedback').textContent='좋아요! 그대로 유지';
    if(p>=1){
      passed.add(cur); holdStart=null;
      if(cur < data.steps.length-1){ cur++; renderSteps(); updateTitle('👍 통과! 다음 동작'); }
      else { renderSteps(); updateTitle('🎉 끝까지 완료! 잘했어요'); }
    }
  }else{
    holdStart=null;
    setBar(closeness, closeness>0.6?'#fa3':'#e33');
    let hint;
    if(!okYaw) hint='몸 방향을 확인하세요';
    else hint = JOINTS[c.worst].name+' 확인 ('+Math.round(c.worstDiff)+'° 차이)';
    $('feedback').textContent=hint;
  }
}

// ---------- 녹화 ----------
function capture(){
  if(!running){ alert('먼저 카메라를 켜주세요'); return; }
  if(capturing) return;
  const startAt = performance.now()+3000;
  capturing={ startAt, samples:[] };
  const tick=()=>{
    if(!capturing){ $('countdown').textContent=''; return; }
    const left=Math.ceil((startAt-performance.now())/1000);
    $('countdown').textContent = left>0 ? left : '';
    if(left>0) setTimeout(tick,100);
  };
  tick();
}

// ---------- 버튼 ----------
$('startCam').onclick=start;
$('flipCam').onclick=async()=>{
  facing = facing==='user' ? 'environment' : 'user';
  $('mirror').checked = facing==='user';
  if(running){ try{ await openCamera(); }catch(e){ $('feedback').textContent='카메라 전환 실패: '+(e.message||e); } }
};
$('modePractice').onclick=()=>setMode('practice');
$('modeRecord').onclick=()=>setMode('record');
$('prevBtn').onclick=()=>{ if(cur>0){cur--; holdStart=null; renderSteps(); updateTitle('');} };
$('nextBtn').onclick=()=>{ if(cur<data.steps.length-1){cur++; holdStart=null; renderSteps(); updateTitle('');} };
$('resetBtn').onclick=()=>{ cur=0; passed.clear(); holdStart=null; renderSteps(); updateTitle(''); };
$('captureBtn').onclick=capture;
$('clearBtn').onclick=()=>{ data.steps[cur].ref=null; save(); renderSteps(); };
$('addStepBtn').onclick=()=>{ const n=prompt('동작 이름 (예: 5. 왼 앞굽이 아래막기)'); if(n){ data.steps.splice(cur+1,0,{name:n,ref:null}); cur++; save(); renderSteps(); updateTitle(''); } };
$('renameBtn').onclick=()=>{ const s=data.steps[cur]; const n=prompt('새 이름', s.name); if(n){ s.name=n; save(); renderSteps(); updateTitle(); } };
$('delStepBtn').onclick=()=>{ if(data.steps.length<=1) return; if(confirm('"'+data.steps[cur].name+'" 삭제할까요?')){ data.steps.splice(cur,1); cur=Math.min(cur,data.steps.length-1); save(); renderSteps(); updateTitle(''); } };
$('fullBtn').onclick=()=>{ const el=$('stage'); (document.fullscreenElement? document.exitFullscreen() : el.requestFullscreen?.()); };
$('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(data.title||'poomsae')+'_정답.json'; a.click();
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{
  const file=e.target.files[0]; if(!file) return;
  try{ const d=JSON.parse(await file.text()); if(!Array.isArray(d.steps)) throw 0; data=d; cur=0; passed.clear(); save(); renderSteps(); updateTitle('불러오기 완료'); }
  catch(err){ alert('파일 형식이 맞지 않습니다'); }
};
const syncLabels=()=>{ $('tolV').textContent=$('tol').value; $('holdV').textContent=$('hold').value; };
$('tol').oninput=syncLabels; $('hold').oninput=syncLabels; syncLabels();

renderSteps(); updateTitle('');
$('stepName').textContent='카메라를 켜주세요';
</script>
</body>
</html>
